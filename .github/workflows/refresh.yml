name: Refresh DSA data

# Fully self-contained automation (2026-08-28) -- see platform/HANDOFF.md for
# the full design and the earlier Slack-routine approach this replaced.
# Runs on its own schedule and detects new data itself (StatsPlus's own
# public, no-auth current-date endpoint vs. Supabase's latest succeeded
# refresh) -- no external trigger, no Slack dependency, no agent in the
# critical path. workflow_dispatch is kept too, for a manual/forced run
# (backfills, testing) -- a manual run always proceeds, skipping the
# new-data check. Secrets here (SUPABASE_SERVICE_ROLE_KEY, STATSPLUS_API_TOKEN)
# live only in this repo's Actions secrets store -- never in a file, never
# visible to Cowork's folder access to this repo, only injected at runtime
# and masked in logs.
on:
  schedule:
    # Every 30 minutes. GitHub does not guarantee exact timing on schedule
    # triggers (can slip further under platform load) -- fine here, "within
    # about half an hour of a sim" is the actual target, not split-second.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this run was triggered (informational only)"
        required: false
        default: "manual trigger"
      # The admin page's "Check for new sim & refresh" button sets this (2026-10-30): the run then behaves like a scheduled tick (only pulls when
      # StatsPlus's game date is ahead of ours). Left false by default, so "Run workflow" from the Actions tab still forces a full refresh.
      only_if_new:
        description: "Only refresh if a new sim is waiting (skip the forced run)"
        required: false
        type: boolean
        default: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      # "true" when the age-aware Potential auto-refit activated a new curve this run (see the rescore-history job below)
      curve_changed: ${{ steps.refresh.outputs.curve_changed }}
    # 30 min covers a normal refresh comfortably (ratings export alone can take
    # a few minutes per StatsPlus's own async job, plus the stats/compute
    # steps) without letting a genuinely hung run burn hours of Actions time.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20 (2026-08-28, fixed after the first live run failed
          # immediately): @supabase/supabase-js's RealtimeClient requires a
          # native global WebSocket at client-construction time, even though
          # nothing here uses realtime features -- Node 20 doesn't have one
          # built in, Node 22 does. Exact error was Supabase's own suggested
          # fix: "Ensure you are running Node.js 22+."
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check for new sim data
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STATSPLUS_BASE_URL: https://atl-02.statsplus.net/thebigleague/api
          STATSPLUS_API_TOKEN: ${{ secrets.STATSPLUS_API_TOKEN }}
        run: npm run check-new-sim

      # A scheduled tick only proceeds if new data was actually found -- most
      # ticks stop here. A manual workflow_dispatch always proceeds (forcing
      # a run doesn't make sense if it's gated on the same check).
      #
      # This one step is the whole pipeline, not just the raw pull --
      # refresh.ts's own downstream chain already runs compute-ratings.ts,
      # compute-team-ratings.ts, every weight-
      # tuning regression, scan-market-contracts.ts, and the trade-block/
      # -history scrapes internally (see its own file for the full list).
      # Two more explicit "Compute player ratings"/"Compute team ratings"
      # steps used to run those same two scripts again right after this one
      # -- removed 2026-09-11, confirmed pure redundancy (refresh.ts had
      # already grown its own internal chain by the time those were added
      # and never got cleaned up) that silently doubled real compute cost
      # every successful cycle, and would have been skipped entirely (no
      # continue-on-error/if: failure()) had this step ever failed partway
      # through its own internal chain.
      - name: Refresh from StatsPlus
        id: refresh
        if: steps.check.outputs.new_data == 'true' || (github.event_name == 'workflow_dispatch' && !inputs.only_if_new)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STATSPLUS_BASE_URL: https://atl-02.statsplus.net/thebigleague/api
          STATSPLUS_API_TOKEN: ${{ secrets.STATSPLUS_API_TOKEN }}
          # Browser-session cookies for StatsPlus WEBSITE pages (standings, ballparks, trade block, trade ledger) -- StatsPlus
          # began refusing those pages without a session ~2026-10-07. Unrelated to the API token above. They expire periodically;
          # when they do the four scrape side tasks fail with an explicit 'cookies were refused' message and the run goes red.
          STATSPLUS_SESSION_ID: ${{ secrets.STATSPLUS_SESSION_ID }}
          STATSPLUS_CSRF_TOKEN: ${{ secrets.STATSPLUS_CSRF_TOKEN }}
        run: npm run refresh

      # Independent ratings-health audit (2026-10-06, after the role-multiplier incident -- see HANDOFF.md).
      # Runs on EVERY tick (if: always(), so it still runs when the refresh step above failed) and re-reads the
      # database: are the newest run's computed ratings actually there, did the hitter/pitcher distribution jump,
      # does every weight group still sum to 1, are failed runs piling up. Any FAIL turns this workflow run red
      # (GitHub emails the repo owner on a failed scheduled run), so stale or implausible ratings can no longer
      # sit unnoticed behind a green-looking refresh for days. Cheap (a few reads), so it is not gated on new data.
      - name: Verify ratings health
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run verify-ratings

  # Age-aware Potential (2026-10-16): when the automatic refit (scripts/auto-refit-potential-realization.ts, run inside refresh.ts) activates a
  # NEW curve, every past run is re-scored with it so the prospect "Change from" picker and any history comparison stay apples to apples. Slow
  # (49+ runs, hours) but rare: a curve only changes when 30+ game days of new evidence pass the backtest gate AND some R moves by >= 0.005.
  # Its own job so the main refresh keeps its 30-minute cap against hung runs. A failure leaves history on the previous curve (logged).
  rescore-history:
    needs: refresh
    if: always() && needs.refresh.outputs.curve_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Re-score every past run with the active curve
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/compute-ratings.ts --all
